version: "3.8"

# =========================================================
# SOC Network Monitoring Stack — Suricata + Zeek + ntopng
# feeding Elasticsearch + Kibana for search/visualization
# =========================================================
# Usage:
#   1. Edit INTERFACE below (default eth0) to your host's monitored NIC
#   2. docker compose up -d
#   3. Kibana:  http://<host-ip>:5601
#   4. ntopng:  http://<host-ip>:3000  (user: admin / pass: admin)
# =========================================================

services:
  # ---- Storage & Visualization ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: soc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - soc-net
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: soc-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - soc-net
    restart: unless-stopped

  # ---- Network IDS / Signature Detection ----
  suricata:
    image: jasonish/suricata:latest
    container_name: soc-suricata
    network_mode: host # required to see live host traffic
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/rules:/etc/suricata/rules
      - ./suricata/logs:/var/log/suricata
    command: -i ${INTERFACE:-eth0} -v
    restart: unless-stopped

  # ---- Protocol-Level Network Analyzer ----
  zeek:
    image: zeek/zeek:latest
    container_name: soc-zeek
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./zeek/logs:/usr/local/zeek/logs
    command: zeek -i ${INTERFACE:-eth0} local
    restart: unless-stopped

  # ---- Live Traffic Dashboard ----
  ntopng:
    image: ntop/ntopng:latest
    container_name: soc-ntopng
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: -i ${INTERFACE:-eth0} -w 3000
    restart: unless-stopped

  # ---- Log Shipper: Suricata/Zeek logs -> Elasticsearch ----
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: soc-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./suricata/logs:/var/log/suricata:ro
      - ./zeek/logs:/var/log/zeek:ro
    depends_on:
      - elasticsearch
      - suricata
      - zeek
    networks:
      - soc-net
    restart: unless-stopped

networks:
  soc-net:
    driver: bridge

volumes:
  es_data:
